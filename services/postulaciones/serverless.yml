service: ceibbo-postulaciones
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  iam:
    role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
  httpApi:
    id: ${cf:ceibbo-shared-${sls:stage}.HttpApiId}
  environment:
    TABLE_NAME: ${cf:ceibbo-shared-${sls:stage}.TableName}
    EVENTS_QUEUE_URL: ${cf:ceibbo-shared-${sls:stage}.EventsQueueUrl}

functions:
  postulaciones:
    handler: src/adapters/in/http.handler
    timeout: 15
    events:
      - httpApi:
          method: POST
          path: /oportunidades
          authorizer: &cognito
            type: jwt
            id: ${cf:ceibbo-shared-${sls:stage}.AuthorizerId}
      - httpApi:
          method: GET
          path: /oportunidades
          authorizer: *cognito
      - httpApi:
          method: POST
          path: /oportunidades/{id}/postulaciones
          authorizer: *cognito
      - httpApi:
          method: GET
          path: /postulaciones/me
          authorizer: *cognito
      - httpApi:
          method: GET
          path: /oportunidades/{id}/postulantes
          authorizer: *cognito
