service: ceibbo-health
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs22.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  iam:
    role: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
  httpApi:
    id: ${cf:ceibbo-shared-${sls:stage}.HttpApiId}
  environment:
    TABLE_NAME: ${cf:ceibbo-shared-${sls:stage}.TableName}

functions:
  health:
    handler: src/adapters/in/http.handler
    timeout: 10
    events:
      - httpApi:
          method: GET
          path: /health
      - httpApi:
          method: GET
          path: /health/privado
          authorizer:
            type: jwt
            id: ${cf:ceibbo-shared-${sls:stage}.AuthorizerId}
