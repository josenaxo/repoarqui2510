name: ceibbo-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: red_talento_tp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ceibbo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d red_talento_tp"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  ceibbo-postgres:
